[workspace]
name = "agx_arm_ros"
channels = ["https://prefix.dev/robostack-humble", "https://prefix.dev/conda-forge"]
platforms = ["linux-aarch64"]

[dependencies]
# Base ROS dependencies
ros-humble-ros-base = "*"
pkg-config = "*"
compilers = "*"
make = "*"
ninja = "*"
ros-humble-ros2cli = "*"

# Build tools
colcon-common-extensions = "*"
cmake = "<4"

# Workspace dependencies
pytest = "*"
ros-humble-ament-cmake = "*"
ros-humble-ament-copyright = "*"
ros-humble-ament-flake8 = "*"
ros-humble-ament-index-python = "*"
ros-humble-ament-lint-auto = "*"
ros-humble-ament-lint-common = "*"
ros-humble-ament-pep257 = "*"
ros-humble-builtin-interfaces = "*"
ros-humble-controller-manager = "*"
ros-humble-geometry-msgs = "*"
ros-humble-joint-state-publisher = "*"
ros-humble-joint-state-broadcaster = "*"
ros-humble-joint-trajectory-controller = "*"
ros-humble-gripper-controllers = "*"
ros-humble-joint-state-publisher-gui = "*"
ros-humble-launch = "*"
ros-humble-launch-ros = "*"
ros-humble-moveit-configs-utils = "*"
ros-humble-moveit-kinematics = "*"
ros-humble-moveit-planners = "*"
ros-humble-moveit-ros-move-group = "*"
ros-humble-moveit-ros-perception = "*"
ros-humble-moveit-ros-visualization = "*"
ros-humble-moveit-ros-warehouse = "*"
ros-humble-moveit-simple-controller-manager = "*"
ros-humble-rclpy = "*"
ros-humble-robot-state-publisher = "*"
ros-humble-rosidl-default-generators = "*"
ros-humble-rosidl-default-runtime = "*"
ros-humble-rviz-common = "*"
ros-humble-rviz-default-plugins = "*"
ros-humble-rviz2 = "*"
ros-humble-sensor-msgs = "*"
ros-humble-std-msgs = "*"
ros-humble-std-srvs = "*"
ros-humble-tf2-ros = "*"
ros-humble-topic-tools = "*"
ros-humble-xacro = "*"
scipy = "*"

# The following packages were not found:
# ros-humble-warehouse-ros-mongo = "*"

[pypi-dependencies]
pyAgxArm = { path = "../pyAgxArm", editable = true }

[tasks]
build = {cmd = "colcon build --symlink-install", description = "Build the ROS workspace"}
test = {cmd = "colcon test", description = "Run tests for the workspace"}
clean = {cmd = "rm -rf build install log", description = "Clean build artifacts (build, install, log directories)"}
piper = {cmd = "ros2 launch agx_arm_ctrl start_single_agx_arm_moveit.launch.py can_port:=can2 arm_type:=piper effector_type:=agx_gripper", description = "piper_arm start"}
can = {cmd = "bash scripts/can_activate_can2.sh"}
# Scripts to source on environment activation, found after first colcon build.

[activation]
scripts = ["install/setup.bash"]
