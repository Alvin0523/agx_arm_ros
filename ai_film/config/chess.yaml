# ─── Chess Board Poses & Sequences ───────────────────────────────────────────
# Named TCP poses, hover offsets, and pick-place sequences for the chess demo.
# This is the file to edit when:
#   - Moving or re-measuring board slot positions
#   - Adding/changing sequences
#   - Adjusting hover heights
# ─────────────────────────────────────────────────────────────────────────────


# ─── Named TCP poses ─────────────────────────────────────────────────────────
# All orientations use qy=1 (TCP pointing straight down — standard pick pose).

poses:
  # ── White chess board (2×2, 5 cm pitch) ──────────────────────────────────
  #   white_tl  white_tr      (+x = further from robot, +y = left)
  #   white_bl  white_br      ← white_br measured from /feedback/tcp_pose

  white_tl:
    x:  0.299
    y:  0.155
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  white_tr:
    x:  0.299
    y:  0.105
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  white_bl:
    x:  0.249
    y:  0.155
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  white_br:
    x:  0.249
    y:  0.105
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  # ── Black chess board (2×2, 5 cm pitch) ──────────────────────────────────
  #   black_tl  black_tr      (+x = further from robot, +y = left)
  #   black_bl  black_br      ← black_bl measured from /feedback/tcp_pose

  black_tl:
    x:  0.297
    y: -0.114
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  black_tr:
    x:  0.297
    y: -0.164
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  black_bl:
    x:  0.247
    y: -0.114
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  black_br:
    x:  0.247
    y: -0.164
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  # ── 3×3 slot plate  (center = 0.311, 0.025, 0.149 ; step = 0.065 m) ──
  #
  #   slot_r1c1  slot_r1c2  slot_r1c3      ← row 1  (far, +x)
  #   slot_r2c1  slot_r2c2  slot_r2c3      ← row 2  (middle)
  #   slot_r3c1  slot_r3c2  slot_r3c3      ← row 3  (near, -x)
  #     col1       col2       col3
  #     left(+y)   centre    right(-y)

  slot_r1c1:
    x:  0.376
    y:  0.090
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r1c2:
    x:  0.376
    y:  0.025
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r1c3:
    x:  0.376
    y: -0.040
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r2c1:
    x:  0.311
    y:  0.090
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r2c2:
    x:  0.311
    y:  0.025
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r2c3:
    x:  0.311
    y: -0.040
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r3c1:
    x:  0.246
    y:  0.090
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r3c2:
    x:  0.246
    y:  0.025
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r3c3:
    x:  0.246
    y: -0.040
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0


# ─── Hover offsets ───────────────────────────────────────────────────────────
# Hover point = pose + offset  →  arm goes here before descending to the pose.
# Only set the axes you need — omitted axes default to 0.0.

offsets:
  offset1:          # straight vertical hover (most common), too high will have error
    z_offset: 0.05

  offset2:          # taller vertical hover
    z_offset: 0.15

  offset3:          # slide in along X + slight lift
    x_offset: 0.10
    z_offset: 0.05


# ─── Sequences ───────────────────────────────────────────────────────────────

sequences:

  piper1:
    label: "piper1 (event)"
    loop: true
    steps:
      # Slot layout:
      #   1=slot_r1c1  2=slot_r1c2  3=slot_r1c3
      #   4=slot_r2c1  5=slot_r2c2  6=slot_r2c3
      #   7=slot_r3c1  8=slot_r3c2  9=slot_r3c3

      # Step 1: white  1 → 7
      - type: pick_place
        pick:         slot_r1c1
        place:        slot_r3c1
        pick_offset:  offset1
        place_offset: offset1

      # Step 2: black  2 → 8
      - type: pick_place
        pick:         slot_r1c2
        place:        slot_r3c2
        pick_offset:  offset1
        place_offset: offset1

      # Step 3: white  7 → 9
      - type: pick_place
        pick:         slot_r3c1
        place:        slot_r3c3
        pick_offset:  offset1
        place_offset: offset1

      # Step 4: black  4 → 6
      - type: pick_place
        pick:         slot_r2c1
        place:        slot_r2c3
        pick_offset:  offset1
        place_offset: offset1

      # Step 5: white  9 → 3
      - type: pick_place
        pick:         slot_r3c3
        place:        slot_r1c3
        pick_offset:  offset1
        place_offset: offset1

      # Step 6: black  8 → 2
      - type: pick_place
        pick:         slot_r3c2
        place:        slot_r1c2
        pick_offset:  offset1
        place_offset: offset1

      # Step 7: white  3 → 1
      - type: pick_place
        pick:         slot_r1c3
        place:        slot_r1c1
        pick_offset:  offset1
        place_offset: offset1

      # Step 8: black  6 → 4  (restores start state)
      - type: pick_place
        pick:         slot_r2c3
        place:        slot_r2c1
        pick_offset:  offset1
        place_offset: offset1

      - type: home

  piper2:
    label: "piper2 (event)"
    loop: true
    steps:
      - type: pick_place
        pick:         white_tl
        place:        black_tl
        pick_offset:  offset1
        place_offset: offset1

      - type: pick_place
        pick:         black_br
        place:        white_br
        pick_offset:  offset1
        place_offset: offset1

      - type: gesture

      - type: pick_place
        pick:         black_tl
        place:        white_tl
        pick_offset:  offset1
        place_offset: offset1

      - type: pick_place
        pick:         white_br
        place:        black_br
        pick_offset:  offset1
        place_offset: offset1

      - type: home

  piper2_white:
    label: "piper2_white (test)"
    loop: true
    steps:
      - type: pick_place
        pick:         white_tl
        place:        white_tr
        pick_offset:  offset1
        place_offset: offset1

      - type: pick_place
        pick:         white_tr
        place:        white_bl
        pick_offset:  offset1
        place_offset: offset1

      - type: pick_place
        pick:         white_bl
        place:        white_br
        pick_offset:  offset1
        place_offset: offset1

      - type: pick_place
        pick:         white_br
        place:        white_tl
        pick_offset:  offset1
        place_offset: offset1

  piper2_black:
    label: "piper2_black (test)"
    loop: true
    steps:
      - type: pick_place
        pick:         black_tl
        place:        black_tr
        pick_offset:  offset1
        place_offset: offset1

      - type: pick_place
        pick:         black_tr
        place:        black_bl
        pick_offset:  offset1
        place_offset: offset1

      - type: pick_place
        pick:         black_bl
        place:        black_br
        pick_offset:  offset1
        place_offset: offset1

      - type: pick_place
        pick:         black_br
        place:        black_tl
        pick_offset:  offset1
        place_offset: offset1

  gesture_showcase:
    label: "gesture_showcase (test)"
    loop: false
    steps:
      - type: gesture
        name: big_wave
      - type: gesture
        name: beckon_human
      - type: gesture
        name: robot_thinking
      - type: gesture
        name: point_sky
      - type: gesture
        name: wander
      - type: gesture
        name: clock_sweep
      - type: gesture
        name: show_off
      - type: gesture
        name: jazz_hands
      - type: gesture
        name: conductor
      - type: gesture
        name: deep_thought
      - type: home
