# ─── Pick & Place Configuration ──────────────────────────────────────────────


# ─── Robot / MoveIt frames ───────────────────────────────────────────────────
robot:
  planning_group: arm
  eef_link:       tcp_link
  base_frame:     base_link


# ─── MoveIt planner settings ─────────────────────────────────────────────────
planner:
  num_planning_attempts:           5
  allowed_planning_time:           10.0
  max_velocity_scaling_factor:     0.3
  max_acceleration_scaling_factor: 0.3
  workspace:
    min: [-1.0, -1.0, -0.5]
    max: [ 1.0,  1.0,  2.0]


# ─── Constraint tolerances ───────────────────────────────────────────────────
constraints:
  position_tolerance:    0.001   # metres
  orientation_tolerance: 0.003   # radians per axis


# ─── Gripper ─────────────────────────────────────────────────────────────────
gripper:
  joint:        gripper   # single joint name
  open_width:   0.025      # metres (position)
  close_width:  0.018     # metres (position)
  effort:       1.0       # Newtons
  move_time:    1.0       # seconds to wait after commanding


# ─── Named TCP poses ─────────────────────────────────────────────────────────
poses:
  top_left:
    x:  0.331
    y:  0.010
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  top_right:
    x:  0.331
    y: -0.040
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  bottom_left:
    x:  0.281
    y:  0.010
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  bottom_right:
    x:  0.281
    y: -0.040
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0


# ─── Hover offsets ───────────────────────────────────────────────────────────
# Only set the axes you need — omitted axes default to 0.0.
# Hover waypoint = pose + offset, so robot shifts BEFORE descending to the pose.
#
#   z_offset only  →  straight up/down hover       (most common)
#   x_offset only  →  slide in along X
#   y_offset only  →  slide in along Y
#   mix freely     →  e.g. x_offset + z_offset for a diagonal approach

offsets:
  offset1:          # small vertical hover — original chess behaviour
    z_offset: 0.08

  offset2:          # taller vertical hover
    z_offset: 0.15

  offset3:          # side approach along X + slight lift
    x_offset: 0.10
    z_offset: 0.05

  # offset4:
  #   y_offset: 0.10
  #   z_offset: 0.05

  # offset5:
  #   x_offset: 0.06
  #   y_offset: 0.06
  #   z_offset: 0.04


# ─── Sequences ───────────────────────────────────────────────────────────────

sequences:
 
  chess_loop:
    loop: true
    steps:
      # Step 1: piece A: TL → TR
      - type: pick_place
        pick:         top_left
        place:        top_right
        pick_offset:  offset1
        place_offset: offset1
 
      # Step 2: piece B: BR → BL
      - type: pick_place
        pick:         bottom_right
        place:        bottom_left
        pick_offset:  offset1
        place_offset: offset1
 
      # Step 3: piece A: TR → BR
      - type: pick_place
        pick:         top_right
        place:        bottom_right
        pick_offset:  offset1
        place_offset: offset1
 
      # Step 4: piece B: BL → TL
      - type: pick_place
        pick:         bottom_left
        place:        top_left
        pick_offset:  offset1
        place_offset: offset1
 
      - type: home

  # ── More examples (uncomment to use) ──────────────────────────────────────

  # one_way:                 # pos1 → pos2 once, go home, done
  #   loop: false
  #   steps:
  #     - type: pick_place
  #       pick:         pos1
  #       place:        pos2
  #       pick_offset:  offset1
  #       place_offset: offset2    # different offset on the place side
  #     - type: home

  # three_stop:              # chain three moves in one pass
  #   loop: false
  #   steps:
  #     - type: pick_place
  #       pick:         pos1
  #       place:        pos2
  #       pick_offset:  offset1
  #       place_offset: offset1
  #     - type: home
  #     - type: pick_place
  #       pick:         pos2
  #       place:        pos3
  #       pick_offset:  offset2
  #       place_offset: offset3
  #     - type: home