# ─── Pick & Place Configuration ──────────────────────────────────────────────


# ─── Robot / MoveIt frames ───────────────────────────────────────────────────
robot:
  planning_group: arm
  eef_link:       tcp_link
  base_frame:     base_link


# ─── MoveIt planner settings ─────────────────────────────────────────────────
planner:
  num_planning_attempts:           3       # stable now — 3 is plenty
  allowed_planning_time:           5.0     # was 15 — planner solves in <1s normally
  max_velocity_scaling_factor:     0.6
  max_acceleration_scaling_factor: 0.5
  workspace:                               # TCP bounding box in base_link frame (metres)
    min: [ 0.10, -0.20, 0.10]             # covers all slot poses + hover headroom
    max: [ 0.55,  0.25, 0.40]             # x:arm reach, y:side reach, z:hover height


# ─── Constraint tolerances ───────────────────────────────────────────────────
constraints:
  position_tolerance:    0.001   # metres
  orientation_tolerance: 0.003   # radians per axis


# ─── Gripper ─────────────────────────────────────────────────────────────────
gripper:
  joint:        gripper   # single joint name
  open_width:   0.03      # metres (position)
  close_width:  0.018     # metres (position)
  effort:       1.0       # Newtons
  move_time:    0.5       # was 1.0 — saves 1s per pick-place step (2 gripper ops each)


# ─── Named TCP poses ─────────────────────────────────────────────────────────
poses:
  top_left:
    x:  0.331
    y:  0.010
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  top_right:
    x:  0.331
    y: -0.040
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  bottom_left:
    x:  0.281
    y:  0.010
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  bottom_right:
    x:  0.281
    y: -0.040
    z:  0.150
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  # ── Gesture waypoints (used by interrupt sequence — no gripper, arm only) ──
  gesture_hover:        # neutral point above the board centre
    x:  0.311
    y:  0.025
    z:  0.280
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  gesture_lean_left:    # shift left — like glancing
    x:  0.311
    y:  0.120
    z:  0.260
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  gesture_lean_right:   # shift right — like glancing the other way
    x:  0.311
    y: -0.070
    z:  0.260
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  # ── 3×3 slot plate  (center = 0.311, 0.025, 0.149 ; step = 0.065 m) ──
  slot_r1c1:          # top-left
    x:  0.376
    y:  0.090
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r1c2:          # top-center
    x:  0.376
    y:  0.025
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r1c3:          # top-right
    x:  0.376
    y: -0.040
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r2c1:          # middle-left
    x:  0.311
    y:  0.090
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r2c2:          # middle-center  (origin slot)
    x:  0.311
    y:  0.025
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r2c3:          # middle-right
    x:  0.311
    y: -0.040
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r3c1:          # bottom-left
    x:  0.246
    y:  0.090
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r3c2:          # bottom-center
    x:  0.246
    y:  0.025
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

  slot_r3c3:          # bottom-right
    x:  0.246
    y: -0.040
    z:  0.149
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0


# ─── Interrupt gesture ──────────────────────────────────────────────────────
# Triggered by /detector=True. Executes AFTER the current pick-place step finishes.
# No gripper. Arm only. Loose tolerance is fine — it's just a display gesture.
# Add/remove pose names in 'sequence' to change the movement.
interrupt:
  sequence:
    - gesture_hover       # lift up above the board
    - gesture_lean_left   # look left
    - gesture_hover       # back to centre
    - gesture_lean_right  # look right
    - gesture_hover       # back to centre before resuming


# ─── Hover offsets ───────────────────────────────────────────────────────────
# Only set the axes you need — omitted axes default to 0.0.
# Hover waypoint = pose + offset, so robot shifts BEFORE descending to the pose.
#
#   z_offset only  →  straight up/down hover       (most common)
#   x_offset only  →  slide in along X
#   y_offset only  →  slide in along Y
#   mix freely     →  e.g. x_offset + z_offset for a diagonal approach

offsets:
  offset1:          # small vertical hover — original chess behaviour
    z_offset: 0.08

  offset2:          # taller vertical hover
    z_offset: 0.15

  offset3:          # side approach along X + slight lift
    x_offset: 0.10
    z_offset: 0.05

  # offset4:
  #   y_offset: 0.10
  #   z_offset: 0.05

  # offset5:
  #   x_offset: 0.06
  #   y_offset: 0.06
  #   z_offset: 0.04


# ─── Sequences ───────────────────────────────────────────────────────────────

sequences:
 
  2x2_loop:
    loop: true
    count: 1       # 0 = infinite; any positive integer = run that many times
    steps:
      # Step 1: piece A: TL → TR
      - type: pick_place
        pick:         top_left
        place:        top_right
        pick_offset:  offset1
        place_offset: offset1
 
      # Step 2: piece B: BR → BL
      - type: pick_place
        pick:         bottom_right
        place:        bottom_left
        pick_offset:  offset1
        place_offset: offset1
 
      # Step 3: piece A: TR → BR
      - type: pick_place
        pick:         top_right
        place:        bottom_right
        pick_offset:  offset1
        place_offset: offset1
 
      # Step 4: piece B: BL → TL
      - type: pick_place
        pick:         bottom_left
        place:        top_left
        pick_offset:  offset1
        place_offset: offset1
 
      - type: home

  chess_loop:
    loop: true
    count: 1       # 0 = infinite; any positive integer = run that many times
    steps:
      # Slot layout:
      #   1=slot_r1c1  2=slot_r1c2  3=slot_r1c3
      #   4=slot_r2c1  5=slot_r2c2  6=slot_r2c3
      #   7=slot_r3c1  8=slot_r3c2  9=slot_r3c3
      # Start: white@1, black@2, black@4, white@5

      # Step 1: white  1 → 7
      - type: pick_place
        pick:         slot_r1c1
        place:        slot_r3c1
        pick_offset:  offset1
        place_offset: offset1

      # Step 2: black  2 → 8
      - type: pick_place
        pick:         slot_r1c2
        place:        slot_r3c2
        pick_offset:  offset1
        place_offset: offset1

      # Step 3: white  7 → 9
      - type: pick_place
        pick:         slot_r3c1
        place:        slot_r3c3
        pick_offset:  offset1
        place_offset: offset1

      # Step 4: black  4 → 6
      - type: pick_place
        pick:         slot_r2c1
        place:        slot_r2c3
        pick_offset:  offset1
        place_offset: offset1

      # Step 5: white  9 → 3
      - type: pick_place
        pick:         slot_r3c3
        place:        slot_r1c3
        pick_offset:  offset1
        place_offset: offset1

      # Step 6: black  8 → 2
      - type: pick_place
        pick:         slot_r3c2
        place:        slot_r1c2
        pick_offset:  offset1
        place_offset: offset1

      # Step 7: white  3 → 1
      - type: pick_place
        pick:         slot_r1c3
        place:        slot_r1c1
        pick_offset:  offset1
        place_offset: offset1

      # Step 8: black  6 → 4  (restores start state)
      - type: pick_place
        pick:         slot_r2c3
        place:        slot_r2c1
        pick_offset:  offset1
        place_offset: offset1

      - type: home

  # ── More examples (uncomment to use) ──────────────────────────────────────

  # one_way:                 # pos1 → pos2 once, go home, done
  #   loop: false
  #   steps:
  #     - type: pick_place
  #       pick:         pos1
  #       place:        pos2
  #       pick_offset:  offset1
  #       place_offset: offset2    # different offset on the place side
  #     - type: home

  # three_stop:              # chain three moves in one pass
  #   loop: false
  #   steps:
  #     - type: pick_place
  #       pick:         pos1
  #       place:        pos2
  #       pick_offset:  offset1
  #       place_offset: offset1
  #     - type: home
  #     - type: pick_place
  #       pick:         pos2
  #       place:        pos3
  #       pick_offset:  offset2
  #       place_offset: offset3
  #     - type: home